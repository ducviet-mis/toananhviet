<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phòng Thi Trắc Nghiệm - Toán Anh Việt</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/es6-shim/0.35.6/es6-shim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f8fafc;
      color: #0f172a;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    /* 1. HEADER FULL WIDTH */
    header {
      flex-shrink: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #e2e8f0;
      z-index: 50;
    }
    .nav-container {
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }
    .back-btn {
      text-decoration: none;
      font-weight: 700;
      color: #0284c7;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      padding: 6px 14px;
      border-radius: 8px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: #e0f2fe;
      transform: translateX(-2px);
    }
    .exam-title-head {
      font-weight: 700;
      color: #0f172a;
      font-size: 0.95rem;
      background: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    /* 2. BỐ CỤC PHÒNG THI FULL MÀN HÌNH */
    .exam-wrapper {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100vh - 53px);
      overflow: hidden;
      position: relative;
    }

    /* Cột trái: Đề PDF tràn 72% chiều rộng màn hình */
    .pdf-pane {
      width: 72%;
      height: 100%;
      background: #1e293b;
      border-right: 1px solid #cbd5e1;
      padding: 6px;
      box-sizing: border-box;
    }
    .pdf-pane-inner {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .pdf-pane iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Cột phải: Bảng trả lời chiếm 28% */
    .answersheet-pane {
      width: 28%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      overflow-y: auto;
      padding: 14px 18px 80px 18px;
      position: relative;
    }

    /* Sticky Header Đếm ngược & Nộp bài */
    .timer-badge {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border: 1.5px solid #bae6fd;
      padding: 8px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
    }
    .timer-text {
      font-weight: 700;
      color: #0284c7;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-submit {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%) !important;
      color: white !important;
      border: none !important;
      padding: 6px 14px !important;
      width: auto !important;
      max-width: 110px !important;
      flex: 0 0 auto !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      font-weight: 700 !important;
      font-size: 0.82rem !important;
      white-space: nowrap !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      box-shadow: 0 3px 10px rgba(249, 115, 22, 0.3) !important;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%) !important;
      transform: translateY(-1px) !important;
      box-shadow: 0 5px 14px rgba(249, 115, 22, 0.4) !important;
    }

    /* CARD KẾT QUẢ */
    #result-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-summary-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .donut-chart-wrapper {
      position: relative;
      width: 70px;
      height: 70px;
      flex-shrink: 0;
    }
    .donut-chart-wrapper svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .donut-bg {
      fill: none;
      stroke: #f1f5f9;
      stroke-width: 4;
    }
    .donut-ring {
      fill: none;
      stroke: #f97316;
      stroke-width: 4;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      transition: stroke-dashoffset 1s ease-in-out;
      stroke-linecap: round;
    }
    .donut-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .donut-score {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0284c7;
      line-height: 1;
    }
    .donut-label {
      font-size: 0.6rem;
      color: #64748b;
      font-weight: 600;
    }
    .result-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex-grow: 1;
    }
    .mini-stat-card {
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      padding: 6px;
      border-radius: 8px;
      text-align: center;
    }
    .mini-stat-value {
      font-size: 0.92rem;
      font-weight: 700;
      color: #0f172a;
    }
    .mini-stat-label {
      font-size: 0.68rem;
      color: #64748b;
      font-weight: 500;
    }

    /* ITEM CÂU HỎI */
    .answer-row {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      transition: all 0.2s ease;
    }
    .answer-row:hover {
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.06);
    }
    .answer-row-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .q-num-label {
      font-weight: 700;
      color: #1e293b;
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .bubble-group {
      display: flex;
      gap: 6px;
    }
    .bubble-group input[type="radio"] {
      display: none;
    }
    .bubble-label {
      width: 34px;
      height: 34px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #475569;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }
    .bubble-label:hover {
      border-color: #0284c7;
      color: #0284c7;
      background: #f0f9ff;
    }
    .bubble-group input[type="radio"]:checked + .bubble-label {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 3px 8px rgba(2, 132, 199, 0.3);
    }

    .short-input-field {
      width: 140px;
      padding: 6px 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .short-input-field:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    /* MÀU ĐÚNG/SAI */
    .answer-row.correct-row {
      border: 1.5px solid #10b981;
      background-color: #ecfdf5;
    }
    .answer-row.incorrect-row {
      border: 1.5px solid #f43f5e;
      background-color: #fff1f2;
    }
    
    .bubble-label.is-student-correct {
      background-color: #10b981 !important;
      color: white !important;
      border-color: #10b981 !important;
    }
    .bubble-label.is-student-incorrect {
      background-color: #f43f5e !important;
      color: white !important;
      border-color: #f43f5e !important;
    }
    .bubble-label.is-system-key {
      border: 2px solid #0284c7 !important;
      color: #0284c7 !important;
      font-weight: 800 !important;
      background: #e0f2fe !important;
    }

    .result-key-info {
      font-size: 0.8rem;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed #cbd5e1;
      display: none;
      line-height: 1.4;
    }

    /* MOBILE TỐI ƯU */
    .mobile-tabs {
      display: none;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
    }
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      background: none;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #0284c7;
      background: #f0f9ff;
      border-top: 3px solid #0284c7;
    }

    @media (max-width: 900px) {
      .exam-wrapper {
        flex-direction: column;
        height: calc(100vh - 105px);
      }
      .mobile-tabs {
        display: flex;
      }
      .pdf-pane, .answersheet-pane {
        width: 100% !important;
        height: 100% !important;
      }
      .answersheet-pane {
        padding-bottom: 80px;
      }
      .exam-title-head {
        font-size: 0.8rem;
        max-width: 160px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hidden-mobile {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav class="nav-container">
      <a href="quiz-list.html" class="back-btn">
        <span>←</span> Danh sách
      </a>
      <span class="exam-title-head" id="exam-title-header">Đang tải đề thi...</span>
    </nav>
  </header>

  <div class="exam-wrapper">
    <!-- KHUNG PDF FULL HEIGHT/WIDTH -->
    <div class="pdf-pane" id="pane-pdf-container">
      <div class="pdf-pane-inner">
        <iframe src="" id="pdf-viewer"></iframe>
      </div>
    </div>

    <!-- PHIẾU TRẢ LỜI -->
    <div class="answersheet-pane" id="pane-sheet-container">
      
      <div class="timer-badge">
        <span class="timer-text" id="countdown">⏱️ --:--</span>
        <button onclick="submitExam()" id="submit-btn" class="btn-submit">NỘP BÀI</button>
      </div>

      <div id="result-box">
        <div class="result-summary-container">
          <div class="donut-chart-wrapper">
            <svg viewBox="0 0 36 36">
              <path class="donut-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path class="donut-ring" id="donut-ring-path" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>
            <div class="donut-center-text">
              <div class="donut-score" id="result-score">0</div>
              <div class="donut-label">Điểm</div>
            </div>
          </div>

          <div class="result-stats-grid">
            <div class="mini-stat-card">
              <div class="mini-stat-value" id="stat-correct" style="color: #10b981;">0/0</div>
              <div class="mini-stat-label">Đúng</div>
            </div>
            <div class="mini-stat-card">
              <div class="mini-stat-value" id="stat-time" style="color: #0284c7;">00:00</div>
              <div class="mini-stat-label">Thời gian</div>
            </div>
          </div>
        </div>
      </div>

      <div id="questions-list"></div>
    </div>
  </div>

  <div class="mobile-tabs">
    <button class="tab-btn active" id="tab-pdf" onclick="switchTab('pdf')">📋 Đọc Đề Bài</button>
    <button class="tab-btn" id="tab-sheet" onclick="switchTab('sheet')">✍️ Phiếu Trả Lời</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://zlltfgfbydgojuuiprsb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Od5eLUer9_l6i6IzNVBjvg_VAZy-9t2';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let quizData = null;
    let timeRemaining = 0;
    let totalDuration = 0;
    let timerInterval = null;
    let userAnswers = {};

    function getDocViewerUrl(filePath) {
      if (!filePath) return '';
      let absoluteUrl = filePath;
      if (!filePath.startsWith('http://') && !filePath.startsWith('https://')) {
        absoluteUrl = window.location.origin + (filePath.startsWith('/') ? '' : '/') + filePath;
      }

      const fileExtension = absoluteUrl.split('.').pop().toLowerCase();
      if (fileExtension === 'pdf') {
        return absoluteUrl;
      } else {
        return `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(absoluteUrl)}`;
      }
    }

    async function loadQuizRoom() {
      const urlParams = new URLSearchParams(window.location.search);
      const quizId = urlParams.get('id');

      if (!quizId) {
        alert("Không tìm thấy mã đề thi!");
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('quizzes')
          .select('*')
          .eq('id', quizId)
          .single();

        if (error || !data) {
          throw new Error("Không thể tìm thấy bài thi trong cơ sở dữ liệu.");
        }

        quizData = data;

        document.getElementById('exam-title-header').innerText = quizData.title;
        document.getElementById('pdf-viewer').src = getDocViewerUrl(quizData.exam_file);

        totalDuration = (quizData.duration || 45) * 60;
        timeRemaining = totalDuration;
        startTimer();

        renderAnswerSheet();
      } catch (err) {
        alert("Lỗi tải phòng thi: " + err.message);
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert("Hết giờ làm bài! Hệ thống tự động nộp bài.");
          submitExam();
          return;
        }
        timeRemaining--;
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById('countdown').innerHTML = `⏱️ Còn: <strong>${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}</strong>`;
      }, 1000);
    }

    function renderAnswerSheet() {
      const list = document.getElementById('questions-list');
      list.innerHTML = '';

      if (!quizData.answer_keys || !Array.isArray(quizData.answer_keys)) return;

      quizData.answer_keys.forEach((item) => {
        userAnswers[item.q_number] = '';

        const row = document.createElement('div');
        row.className = 'answer-row';
        row.id = `q-row-${item.q_number}`;

        let actionHtml = '';

        if (item.q_type === 'multiple_choice') {
          actionHtml = `
            <div class="bubble-group">
              ${['A', 'B', 'C', 'D'].map(char => `
                <div>
                  <input type="radio" id="b-${item.q_number}-${char}" name="ans-${item.q_number}" value="${char}" onchange="saveAnswer(${item.q_number}, '${char}')">
                  <label for="b-${item.q_number}-${char}" class="bubble-label" id="lbl-${item.q_number}-${char}">${char}</label>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          actionHtml = `
            <input type="text" class="short-input-field" placeholder="Nhập đáp án..." oninput="saveAnswer(${item.q_number}, this.value)">
          `;
        }

        row.innerHTML = `
          <div class="answer-row-content">
            <div class="q-num-label">Câu ${item.q_number}:</div>
            ${actionHtml}
          </div>
          <div class="result-key-info" id="key-info-${item.q_number}">
            <div style="color: #0284c7; font-weight: 700;">Đáp án chuẩn: ${item.correct_answer}</div>
            ${item.explanation ? `<div style="color: #64748b; margin-top: 2px;">💡 ${item.explanation}</div>` : ''}
          </div>
        `;
        list.appendChild(row);
      });
    }

    function saveAnswer(qNum, value) {
      userAnswers[qNum] = value.trim();
    }

    function submitExam() {
      if (!confirm("Bạn có chắc chắn muốn nộp bài thi này?")) return;
      clearInterval(timerInterval);

      document.querySelectorAll('input, button').forEach(el => el.disabled = true);
      document.getElementById('submit-btn').style.display = 'none';

      let totalScore = quizData.total_score || 10;
      let totalQuestions = quizData.answer_keys.length;
      let scorePerQuestion = totalScore / totalQuestions;
      let earnedScore = 0;
      let correctCount = 0;

      quizData.answer_keys.forEach(item => {
        const row = document.getElementById(`q-row-${item.q_number}`);
        const keyInfo = document.getElementById(`key-info-${item.q_number}`);
        
        let isCorrect = false;
        const studentAns = userAnswers[item.q_number] || '';

        if (item.q_type === 'multiple_choice') {
          const sysKey = item.correct_answer.toUpperCase();
          const sysLbl = document.getElementById(`lbl-${item.q_number}-${sysKey}`);
          if (sysLbl) sysLbl.classList.add('is-system-key');

          if (studentAns) {
            const studentLbl = document.getElementById(`lbl-${item.q_number}-${studentAns.toUpperCase()}`);
            if (studentAns.toUpperCase() === sysKey) {
              isCorrect = true;
              if (studentLbl) studentLbl.classList.add('is-student-correct');
            } else {
              if (studentLbl) studentLbl.classList.add('is-student-incorrect');
            }
          }
        } else {
          if (studentAns.toLowerCase() === item.correct_answer.toLowerCase()) {
            isCorrect = true;
          }
        }

        if (isCorrect) {
          row.classList.add('correct-row');
          earnedScore += scorePerQuestion;
          correctCount++;
        } else {
          row.classList.add('incorrect-row');
        }

        keyInfo.style.display = 'block';
      });

      const timeSpent = totalDuration - timeRemaining;
      const spentMins = Math.floor(timeSpent / 60);
      const spentSecs = timeSpent % 60;

      const scoreFormatted = earnedScore.toFixed(1);
      const percentage = Math.round((earnedScore / totalScore) * 100);

      document.getElementById('result-score').innerText = scoreFormatted;
      document.getElementById('stat-correct').innerText = `${correctCount}/${totalQuestions}`;
      document.getElementById('stat-time').innerText = `${spentMins < 10 ? '0' : ''}${spentMins}:${spentSecs < 10 ? '0' : ''}${spentSecs}`;

      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';

      setTimeout(() => {
        const donutRing = document.getElementById('donut-ring-path');
        if (donutRing) {
          donutRing.style.strokeDasharray = `${percentage}, 100`;
        }
      }, 100);

      document.getElementById('pane-sheet-container').scrollTop = 0;
    }

    function switchTab(tabName) {
      const tabPdf = document.getElementById('tab-pdf');
      const tabSheet = document.getElementById('tab-sheet');
      const panePdf = document.getElementById('pane-pdf-container');
      const paneSheet = document.getElementById('pane-sheet-container');

      if (tabName === 'pdf') {
        tabPdf.classList.add('active');
        tabSheet.classList.remove('active');
        panePdf.classList.remove('hidden-mobile');
        paneSheet.classList.add('hidden-mobile');
      } else {
        tabSheet.classList.add('active');
        tabPdf.classList.remove('active');
        paneSheet.classList.remove('hidden-mobile');
        panePdf.classList.add('hidden-mobile');
      }
    }

    function checkResponsive() {
      if (window.innerWidth <= 900) {
        switchTab('pdf');
      } else {
        document.getElementById('pane-pdf-container').classList.remove('hidden-mobile');
        document.getElementById('pane-sheet-container').classList.remove('hidden-mobile');
      }
    }

    window.addEventListener('resize', checkResponsive);
    document.addEventListener('DOMContentLoaded', () => {
      loadQuizRoom();
      checkResponsive();
    });
  </script>
</body>
</html>
