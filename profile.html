<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin học viên - Toán Anh Việt</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .profile-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 20px;
    }
    .avatar-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .avatar-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #0284c7;
      background: #f1f5f9;
    }
    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    .btn-upload {
      border: 1px dashed #0284c7;
      color: #0284c7;
      background-color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .upload-btn-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group.full-width {
      grid-column: span 2;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      color: #475569;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .btn-save {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-save:hover {
      background: #0369a1;
    }
    .btn-open-pass-modal {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    .btn-open-pass-modal:hover {
      background: #059669;
    }
    .btn-logout {
      width: 100%;
      padding: 10px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    .btn-logout:hover {
      background: #dc2626;
    }

    /* CSS MODAL POPUP POPUP ĐỔI MẬT KHẨU */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      position: relative;
      transform: scale(0.95);
      transition: all 0.25s ease;
      box-sizing: border-box;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      background: transparent;
      border: none;
      font-size: 20px;
      color: #94a3b8;
      cursor: pointer;
    }

    .modal-close-btn:hover { color: #334155; }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin: 0 0 6px 0;
      font-family: 'Inter', sans-serif;
    }

    .modal-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }

    .form-group-modal {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label-modal {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .input-modal-field {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 500;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-modal-field:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-submit-pass {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }

    .btn-submit-pass:hover {
      background-color: #0369a1;
    }

    .modal-status-msg {
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 14px;
      display: none;
      text-align: center;
      font-weight: 500;
    }

    .modal-status-msg.error { background-color: #fef2f2; color: #ef4444; }
    .modal-status-msg.success { background-color: #f0fdf4; color: #16a34a; }
  </style>
</head>
<body>

  <!-- HEADER DÙNG CHUNG -->
  <header class="site-header"></header>

  <main>
    <div class="profile-container">
      <div class="profile-header">
        <div class="avatar-wrapper">
          <img id="user-avatar" class="avatar-img" src="https://api.dicebear.com/7.x/identicon/svg?seed=default" alt="Avatar">
          <div class="upload-btn-wrapper">
            <button class="btn-upload">Chọn ảnh từ máy</button>
            <input type="file" id="avatar-file-input" accept="image/*" onchange="uploadAvatarFile(this)">
          </div>
        </div>
        <div>
          <h2 id="welcome-title" style="margin:0; font-size:20px; color:#1e293b;">Học viên Toán Anh Việt</h2>
          <p id="user-email-display" style="margin:4px 0 0 0; color:#64748b; font-size:14px;"></p>
        </div>
      </div>

      <form id="profile-form" onsubmit="saveProfile(event)">
        <div class="form-grid">
          <!-- HỌ TÊN -->
          <div class="form-group full-width">
            <label>Họ và tên học sinh:</label>
            <input type="text" id="p-name" placeholder="Ví dụ: Nguyễn Văn A" required>
          </div>

          <!-- NGÀY SINH & SĐT -->
          <div class="form-group">
            <label>Ngày tháng năm sinh:</label>
            <input type="date" id="p-dob">
          </div>

          <div class="form-group">
            <label>Số điện thoại liên hệ:</label>
            <input type="tel" id="p-phone" placeholder="Ví dụ: 0987654321">
          </div>

          <!-- KHỐI LỚP -->
          <div class="form-group full-width">
            <label>Khối lớp đang học:</label>
            <select id="p-grade">
              <option value="6">Lớp 6</option>
              <option value="7">Lớp 7</option>
              <option value="8">Lớp 8</option>
              <option value="9">Lớp 9</option>
            </select>
          </div>

          <!-- TỈNH / THÀNH PHỐ -->
          <div class="form-group">
            <label>Tỉnh / Thành phố:</label>
            <select id="p-province" onchange="onProvinceChange()">
              <option value="">-- Chọn Tỉnh / Thành phố --</option>
            </select>
          </div>

          <!-- PHƯỜNG / XÃ -->
          <div class="form-group">
            <label>Phường / Xã:</label>
            <select id="p-ward">
              <option value="">-- Chọn Phường / Xã --</option>
            </select>
          </div>
        </div>

        <input type="hidden" id="p-avatar-url">
        <button type="submit" class="btn-save">Lưu thay đổi thông tin</button>
      </form>

      <!-- NÚT MỞ POPUP ĐỔI MẬT KHẨU -->
      <button type="button" onclick="openPasswordModal()" class="btn-open-pass-modal">Đổi mật khẩu tài khoản</button>

      <button onclick="handleLogout()" class="btn-logout">Đăng xuất tài khoản</button>
      <div id="status-msg" style="text-align:center; margin-top:10px; font-size:14px;"></div>
    </div>
  </main>

  <!-- MODAL POPUP ĐỔI MẬT KHẨU -->
  <div class="modal-overlay" id="password-modal">
    <div class="modal-box">
      <button class="modal-close-btn" onclick="closePasswordModal()">✕</button>
      <h3 class="modal-title">Đổi mật khẩu</h3>
      <p class="modal-sub">Nhập mật khẩu mới bên dưới để cập nhật bảo mật cho tài khoản của bạn.</p>

      <div class="modal-status-msg" id="pass-modal-msg"></div>

      <form onsubmit="handlePasswordUpdate(event)">
        <div class="form-group-modal">
          <label class="form-label-modal">Mật khẩu mới</label>
          <input type="password" id="input-new-password" class="input-modal-field" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" required />
        </div>

        <div class="form-group-modal">
          <label class="form-label-modal">Xác nhận mật khẩu mới</label>
          <input type="password" id="input-confirm-password" class="input-modal-field" placeholder="Nhập lại mật khẩu mới" required />
        </div>

        <button type="submit" id="btn-submit-pass-action" class="btn-submit-pass">Cập nhật mật khẩu</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zlltfgfbydgojuuiprsb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Od5eLUer9_l6i6IzNVBjvg_VAZy-9t2';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let locationData = [];

    // 1. TẢI DỮ LIỆU ĐƠN VỊ HÀNH CHÍNH (TỈNH -> PHƯỜNG XÃ)
    async function loadLocationData() {
      try {
        const res = await fetch('https://esgoo.net/api-tinhthanhi/1/0.htm');
        const data = await res.json();
        if (data.error === 0) {
          locationData = data.data;
          const provinceSelect = document.getElementById('p-province');
          provinceSelect.innerHTML = '<option value="">-- Chọn Tỉnh / Thành phố --</option>';
          locationData.forEach(prov => {
            provinceSelect.innerHTML += `<option value="${prov.id}">${prov.name}</option>`;
          });
        }
      } catch (e) {
        console.error('Lỗi nạp dữ liệu Tỉnh/Thành:', e);
      }
    }

    // Khi chọn Tỉnh/Thành phố -> Lấy danh sách Phường/Xã tương ứng
    async function onProvinceChange(selectedWardId = null) {
      const provId = document.getElementById('p-province').value;
      const wardSelect = document.getElementById('p-ward');
      wardSelect.innerHTML = '<option value="">-- Chọn Phường / Xã --</option>';

      if (!provId) return;

      try {
        const res = await fetch(`https://esgoo.net/api-tinhthanhi/2/${provId}.htm`);
        const data = await res.json();
        if (data.error === 0) {
          data.data.forEach(ward => {
            wardSelect.innerHTML += `<option value="${ward.id}">${ward.name}</option>`;
          });
          if (selectedWardId) {
            wardSelect.value = selectedWardId;
          }
        }
      } catch (e) {
        console.error('Lỗi nạp Phường/Xã:', e);
      }
    }

    async function checkUserSession() {
      await loadLocationData();

      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      document.getElementById('user-email-display').innerText = user.email;

      const meta = user.user_metadata || {};
      if(meta.full_name) document.getElementById('p-name').value = meta.full_name;
      if(meta.phone) document.getElementById('p-phone').value = meta.phone;
      if(meta.grade) document.getElementById('p-grade').value = meta.grade;
      if(meta.dob) document.getElementById('p-dob').value = meta.dob;
      
      if(meta.province_id) {
        document.getElementById('p-province').value = meta.province_id;
        await onProvinceChange(meta.ward_id);
      }

      const avatarSrc = meta.avatar_url || `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(user.email)}`;
      document.getElementById('p-avatar-url').value = meta.avatar_url || '';
      document.getElementById('user-avatar').src = avatarSrc;
      
      if(meta.full_name) document.getElementById('welcome-title').innerText = "Xin chào, " + meta.full_name;
    }

    async function uploadAvatarFile(inputElement) {
      if (!inputElement.files || inputElement.files.length === 0) return;
      const file = inputElement.files[0];
      const msg = document.getElementById('status-msg');
      
      msg.style.color = '#0284c7';
      msg.innerText = 'Đang tải ảnh lên kho lưu trữ...';

      const fileExt = file.name.split('.').pop();
      const filePath = `${currentUser.id}/avatar_${Date.now()}.${fileExt}`;

      const { data, error } = await _supabase.storage
        .from('avatar')
        .upload(filePath, file, { upsert: true });

      if (error) {
        msg.style.color = '#ef4444';
        msg.innerText = 'Lỗi upload ảnh: ' + error.message;
        return;
      }

      const { data: { publicUrl } } = _supabase.storage.from('avatar').getPublicUrl(filePath);
      
      document.getElementById('p-avatar-url').value = publicUrl;
      document.getElementById('user-avatar').src = publicUrl;
      msg.style.color = '#22c55e';
      msg.innerText = 'Tải ảnh lên thành công! Bấm nút Lưu phía dưới để hoàn tất.';
    }

    async function saveProfile(e) {
      e.preventDefault();
      const msg = document.getElementById('status-msg');
      msg.style.color = '#0284c7';
      msg.innerText = 'Đang lưu thông tin dữ liệu...';

      const name = document.getElementById('p-name').value;
      const phone = document.getElementById('p-phone').value;
      const grade = document.getElementById('p-grade').value;
      const dob = document.getElementById('p-dob').value;
      const provinceId = document.getElementById('p-province').value;
      const wardId = document.getElementById('p-ward').value;
      const avatarUrl = document.getElementById('p-avatar-url').value;

      const { error } = await _supabase.auth.updateUser({
        data: { 
          full_name: name, 
          phone: phone, 
          grade: grade, 
          dob: dob,
          province_id: provinceId,
          ward_id: wardId,
          avatar_url: avatarUrl 
        }
      });

      if (error) {
        msg.style.color = '#ef4444';
        msg.innerText = 'Gặp lỗi khi lưu: ' + error.message;
      } else {
        localStorage.setItem('tav_user_session', JSON.stringify({
          name: name,
          email: currentUser.email,
          avatar: avatarUrl || `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(currentUser.email)}`
        }));

        msg.style.color = '#22c55e';
        msg.innerText = 'Cập nhật hồ sơ thành công!';
        document.getElementById('welcome-title').innerText = "Xin chào, " + name;
        window.location.reload();
      }
    }

    /* ĐIỀU KHIỂN MODAL POPUP ĐỔI MẬT KHẨU */
    function openPasswordModal() {
      document.getElementById('password-modal').classList.add('active');
      document.getElementById('input-new-password').focus();
    }

    function closePasswordModal() {
      document.getElementById('password-modal').classList.remove('active');
      const msgBox = document.getElementById('pass-modal-msg');
      msgBox.style.display = 'none';
      document.getElementById('input-new-password').value = '';
      document.getElementById('input-confirm-password').value = '';
    }

    async function handlePasswordUpdate(e) {
      e.preventDefault();
      const newPass = document.getElementById('input-new-password').value.trim();
      const confirmPass = document.getElementById('input-confirm-password').value.trim();
      const btn = document.getElementById('btn-submit-pass-action');

      if (newPass.length < 6) {
        showPassMsg('Mật khẩu mới phải có ít nhất 6 ký tự!', 'error');
        return;
      }

      if (newPass !== confirmPass) {
        showPassMsg('Xác nhận mật khẩu mới không trùng khớp!', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Đang cập nhật...';

      try {
        const { error } = await _supabase.auth.updateUser({
          password: newPass
        });

        if (error) {
          showPassMsg('Đổi mật khẩu thất bại: ' + error.message, 'error');
        } else {
          showPassMsg('Đổi mật khẩu thành công!', 'success');
          setTimeout(() => {
            closePasswordModal();
          }, 1200);
        }
      } catch (err) {
        showPassMsg('Có lỗi hệ thống xảy ra!', 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Cập nhật mật khẩu';
      }
    }

    function showPassMsg(text, type) {
      const msgBox = document.getElementById('pass-modal-msg');
      msgBox.innerText = text;
      msgBox.className = `modal-status-msg ${type}`;
      msgBox.style.display = 'block';
    }

    async function handleLogout() {
      localStorage.removeItem('tav_user_session');
      await _supabase.auth.signOut();
      window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', checkUserSession);
  </script>
  <script src="header.js"></script>
</body>
</html>
