<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Lớp Học - Gia sư Toán Anh Việt</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .class-detail-container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      min-height: 70vh;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #0284c7; }

    /* BANNER THÔNG TIN LỚP HỌC */
    .class-info-banner {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border-radius: 18px;
      padding: 28px 32px;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.15);
      margin-bottom: 30px;
    }
    .class-banner-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 10px 0;
      font-family: 'Inter', sans-serif;
    }
    .class-banner-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 14px;
      opacity: 0.95;
    }

    /* TAB DỌC/NGANG CHUYỂN ĐỔI */
    .content-tabs {
      display: flex;
      gap: 12px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 25px;
    }
    .tab-item-btn {
      background: none;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .tab-item-btn:hover { color: #0284c7; }
    .tab-item-btn.active {
      color: #0284c7;
      border-color: #0284c7;
      font-weight: 700;
    }

    /* KHUNG CARD BÀI TẬP / BÀI GIẢNG CHUẨN DESIGN */
    .resource-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }
    .resource-card:hover {
      border-color: #0284c7;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.08);
    }

    .resource-info h4 {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      margin: 0 0 6px 0;
      font-family: 'Inter', sans-serif;
    }
    .resource-info p {
      font-size: 13px;
      color: #64748b;
      margin: 0;
    }

    /* NÚT VÀO PHÒNG THI / XEM VIDEO NỔI BẬT */
    .resource-btn {
      background-color: #f0f9ff;
      color: #0284c7;
      border: 1px solid #bae6fd;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .resource-btn:hover {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    /* PHÒNG THI HIGHLIGHT BUTTON */
    .resource-btn.exam-btn {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
    }
    .resource-btn.exam-btn:hover {
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(249, 115, 22, 0.35);
    }

    .empty-content-msg {
      text-align: center;
      padding: 50px 20px;
      color: #64748b;
      background: #ffffff;
      border-radius: 16px;
      border: 2px dashed #cbd5e1;
    }

    @media (max-width: 600px) {
      .resource-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .resource-btn { width: 100%; text-align: center; justify-content: center; box-sizing: border-box; }
    }
  </style>
</head>
<body>

  <!-- HEADER DÙNG CHUNG -->
  <header class="site-header"></header>

  <main class="class-detail-container">
    <a href="my-class.html" class="back-link">← Quay lại danh sách lớp</a>

    <!-- BANNER NỔI BẬT LỚP HỌC -->
    <div class="class-info-banner">
      <h1 class="class-banner-title" id="class-title-text">Đang tải lớp học...</h1>
      <div class="class-banner-meta">
        <span>👨‍🏫 Giáo viên: <b id="class-teacher-text">Thầy Đặng Đức Việt</b></span>
        <span>🔑 Mã ID Lớp: <b id="class-code-text">...</b></span>
      </div>
    </div>

    <!-- TAB DỌC: VIDEO / ĐỀ THI PHÒNG THI / TÀI LIỆU -->
    <div class="content-tabs">
      <button class="tab-item-btn active" onclick="switchContentTab('video', this)">📹 Bài giảng & Video bổ sung</button>
      <button class="tab-item-btn" onclick="switchContentTab('exercise', this)">📝 Bài tập & Đề thi</button>
      <button class="tab-item-btn" onclick="switchContentTab('doc', this)">📄 Tài liệu PDF</button>
    </div>

    <!-- KHU VỰC HIỂN THỊ DANH SÁCH TẢI TỪ SUPABASE -->
    <div id="content-list-container">
      <p style="text-align: center; color: #64748b; padding: 40px 0;">Đang tải bài học...</p>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://zlltfgfbydgojuuiprsb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Od5eLUer9_l6i6IzNVBjvg_VAZy-9t2';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const currentClassId = urlParams.get('class_id');

    let allClassContents = [];
    let currentTabType = 'video';

    async function initClassDetail() {
      if (!currentClassId) {
        window.location.href = 'my-class.html';
        return;
      }

      document.getElementById('class-code-text').innerText = currentClassId;

      // 1. Tải thông tin lớp từ Supabase
      const { data: classInfo } = await _supabase
        .from('classes')
        .select('*')
        .eq('class_id', currentClassId)
        .single();

      if (classInfo) {
        document.getElementById('class-title-text').innerText = classInfo.title;
        document.getElementById('class-teacher-text').innerText = classInfo.teacher || 'Thầy Đặng Đức Việt';
      }

      // 2. Tải bài học/đề thi thuộc lớp này
      loadClassContentsFromSupabase();
    }

    async function loadClassContentsFromSupabase() {
      const container = document.getElementById('content-list-container');

      try {
        const { data: list, error } = await _supabase
          .from('class_contents')
          .select('*')
          .eq('class_id', currentClassId)
          .order('created_at', { ascending: false });

        if (error) throw error;

        allClassContents = list || [];
        renderTabContents(currentTabType);

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="empty-content-msg">Chưa có dữ liệu bài học cho lớp này.</div>';
      }
    }

    function renderTabContents(type) {
      const container = document.getElementById('content-list-container');
      const filtered = allClassContents.filter(item => item.type === type);

      if (filtered.length === 0) {
        const typeNames = { video: 'video bài giảng', exercise: 'đề thi / bài tập', doc: 'tài liệu PDF' };
        container.innerHTML = `
          <div class="empty-content-msg">
            Chưa có ${typeNames[type]} nào được tải lên cho lớp này.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        let actionBtnHtml = '';

        if (type === 'exercise') {
          // Link dẫn sang PHÒNG THI TRẮC NGHIỆM & TỰ LUẬN (quiz-room.html)
          const targetUrl = item.content_url && item.content_url.includes('quiz-room.html') 
            ? item.content_url 
            : `quiz-room.html?id=${item.content_url || '8G01'}`;

          actionBtnHtml = `<a href="${targetUrl}" class="resource-btn exam-btn">Vào Phòng Thi 🎯</a>`;
        } else if (type === 'video') {
          actionBtnHtml = `<a href="${item.content_url || '#'}" target="_blank" class="resource-btn">Xem Video 🎥</a>`;
        } else {
          actionBtnHtml = `<a href="${item.content_url || '#'}" target="_blank" class="resource-btn">Mở Tài Liệu 📄</a>`;
        }

        return `
          <div class="resource-card">
            <div class="resource-info">
              <h4>${item.title}</h4>
              <p>${item.description || 'Nội dung bám sát lộ trình lớp học của Thầy Việt'}</p>
            </div>
            ${actionBtnHtml}
          </div>
        `;
      }).join('');
    }

    function switchContentTab(type, btnEl) {
      currentTabType = type;
      document.querySelectorAll('.tab-item-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      renderTabContents(type);
    }

    document.addEventListener('DOMContentLoaded', initClassDetail);
  </script>
  <script src="header.js"></script>
  <script src="footer.js"></script>
</body>
</html>
